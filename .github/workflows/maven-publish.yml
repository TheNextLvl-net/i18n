name: Maven Publish
on:
  release:
    types: [ prereleased, released ]
jobs:
  build:
    env:
      JPM_PUBLISH_USERNAME: ${{ secrets.REPOSITORY_USER }}
      JPM_PUBLISH_PASSWORD: ${{ secrets.REPOSITORY_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup jpm
        uses: java-package-manager/setup-jpm@v1
      - name: Install jpm-publish
        run: jpm add -g github:java-package-manager/jpm-publish
      - name: Install dependencies
        run: jpm install --frozen
      - name: Publish with jpm to Repository
        run: jpm publish
