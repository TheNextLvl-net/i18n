name: Build
on: [ pull_request, push ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup jpm
        uses: java-package-manager/setup-jpm@v1
      - name: Install dependencies
        run: jpm install --frozen
      - name: Build with jpm
        run: jpm build
      - name: Test with jpm
        run: jpm test
